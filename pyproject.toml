[project]
name = "checkin"
version = "0.1.0"
description = "Extensible multi-site check-in automation with uv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.52.0",
]

[project.scripts]
checkin = "checkin.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["checkin"]
